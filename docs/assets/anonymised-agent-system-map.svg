    <text x="265" y="639" text-anchor="middle" class="sans navy" font-size="21" font-weight="900">MODEL SLOT A</text>
    <rect x="92" y="681" width="168" height="80" rx="14" class="soft"/><rect x="270" y="681" width="168" height="80" rx="14" class="soft"/>
    <text x="176" y="709" text-anchor="middle" class="sans label navy">IDENTITY + RULES</text><text x="176" y="733" text-anchor="middle" class="sans" font-size="11" fill="#627583">mission • authority</text><text x="176" y="749" text-anchor="middle" class="sans" font-size="11" fill="#627583">freshness</text>
    <text x="354" y="709" text-anchor="middle" class="sans label navy">SKILLS + TOOLS</text><text x="354" y="733" text-anchor="middle" class="sans" font-size="11" fill="#627583">analysis • sources</text><text x="354" y="749" text-anchor="middle" class="sans" font-size="11" fill="#627583">monitoring</text>
    <rect x="92" y="779" width="346" height="78" rx="14" class="soft"/>
    <text x="265" y="807" text-anchor="middle" class="sans label navy">MEMORY ≠ KNOWLEDGE</text><text x="265" y="833" text-anchor="middle" class="sans tiny muted">compact handover | long-term archive by retrieval</text>
    <rect x="92" y="875" width="346" height="92" rx="14" class="owner"/>
    <text x="265" y="903" text-anchor="middle" class="sans label orangeText">OWNER-ONLY CONTEXT</text>
    <text x="265" y="930" text-anchor="middle" class="sans tiny muted">tasks • workspace • raw_data • artifacts • logs</text>
    <text x="265" y="953" text-anchor="middle" class="sans tiny muted">reviewed reports / outputs remain with this owner</text>
  </g>

