<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img" aria-labelledby="title desc">
  <title id="title">Anonymised Example Agentic System Map</title>
  <desc id="desc">A systematic anonymous multi-agent harness with a user board, a control-center manager model, four domain agents with replaceable employee models, private owner data, shared methods, task flow, verification gates, and runtime adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ec"/><stop offset="1" stop-color="#edf3f5"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203c55"/><stop offset="1" stop-color="#315d73"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb054"/><stop offset="1" stop-color="#ee773d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d3548" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d73"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d98b2d"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.title{font-family:Inter,Arial,sans-serif;font-weight:850;fill:#183247}.muted{fill:#627583}.white{fill:white}.navy{fill:#203c55}.orangeText{fill:#8b411c}.small{font-size:15px}.tiny{font-size:13px}.label{font-size:17px;font-weight:750}.card{fill:#fff;stroke:#b9c9d1;stroke-width:1.5}.soft{fill:#f2f6f7;stroke:#c6d3d8;stroke-width:1.2}.owner{fill:#fff8ed;stroke:#eaa75c;stroke-width:1.5;stroke-dasharray:6 5}.control{stroke:#315d73;stroke-width:3;fill:none;marker-end:url(#arrow)}.method{stroke:#8a6aad;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1350" fill="url(#bg)"/>
  <rect x="38" y="34" width="1724" height="1278" rx="34" fill="none" stroke="#315d73" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="900" y="66" text-anchor="middle" class="title" font-size="30">ANONYMISED EXAMPLE AGENTIC SYSTEM</text>
  <text x="900" y="93" text-anchor="middle" class="sans muted" font-size="16">The harness is the entire configured boundary: models, files, flows, permissions, tools, state, gates, and adapters.</text>

  <g filter="url(#shadow)">
    <rect x="615" y="112" width="570" height="84" rx="22" fill="#fff" stroke="#d98b2d" stroke-width="2.5"/>
    <text x="900" y="146" text-anchor="middle" class="title" font-size="23">USER / BOARD</text>
    <text x="900" y="174" text-anchor="middle" class="sans muted" font-size="16">purpose • priorities • risk tolerance • approval for external action</text>
  </g>
  <path d="M900 196V227" class="control"/>

  <g filter="url(#shadow)">
    <rect x="135" y="230" width="1530" height="235" rx="28" fill="#fff" stroke="#315d73" stroke-width="2.5"/>
    <rect x="135" y="230" width="1530" height="48" rx="28" fill="url(#navy)"/>
    <path d="M135 254Q135 230 159 230H1641Q1665 230 1665 254V278H135Z" fill="url(#navy)"/>
    <text x="900" y="262" text-anchor="middle" class="sans white" font-size="22" font-weight="820">CONTROL CENTER — REGISTRY, ROUTER, COORDINATOR, AND GOVERNANCE OWNER</text>

    <rect x="175" y="300" width="315" height="124" rx="22" fill="url(#orange)" stroke="#c35a2b" stroke-width="2"/>
    <text x="332" y="328" text-anchor="middle" class="sans orangeText" font-size="14" font-weight="800">ACTIVE MODEL • REPLACEABLE</text>
    <text x="332" y="362" text-anchor="middle" class="sans navy" font-size="25" font-weight="900">MANAGER MODEL</text>
    <text x="332" y="390" text-anchor="middle" class="sans navy" font-size="15" font-weight="700">manager only in this multi-agent role</text>
    <text x="332" y="411" text-anchor="middle" class="sans navy" font-size="11">routes • integrates • private data stays with domain owners</text>

    <rect x="520" y="300" width="250" height="124" rx="17" class="soft"/>
    <text x="645" y="329" text-anchor="middle" class="sans label navy">REGISTRY &amp; ROUTING</text>
    <text x="645" y="355" text-anchor="middle" class="sans small muted">SYSTEM_MAP.md</text>
    <text x="645" y="379" text-anchor="middle" class="sans small muted">descriptions • exclusions</text>
    <text x="645" y="403" text-anchor="middle" class="sans small muted">positive / negative / collision evals</text>

    <rect x="790" y="300" width="250" height="124" rx="17" class="soft"/>
    <text x="915" y="329" text-anchor="middle" class="sans label navy">TASK &amp; STATE</text>
    <text x="915" y="355" text-anchor="middle" class="sans small muted">task.yaml = authority</text>
    <text x="915" y="379" text-anchor="middle" class="sans small muted">STATUS.md = generated view</text>
    <text x="915" y="403" text-anchor="middle" class="sans small muted">handoff • checkpoints • receipts</text>

    <rect x="1060" y="300" width="250" height="124" rx="17" class="soft"/>
    <text x="1185" y="329" text-anchor="middle" class="sans label navy">QUALITY &amp; SAFETY</text>
    <text x="1185" y="355" text-anchor="middle" class="sans small muted">completion gates • validators</text>
    <text x="1185" y="379" text-anchor="middle" class="sans small muted">budgets • locks • worktrees</text>
    <text x="1185" y="403" text-anchor="middle" class="sans small muted">human approval for external action</text>

    <rect x="1330" y="300" width="295" height="124" rx="17" class="soft"/>
    <text x="1477" y="329" text-anchor="middle" class="sans label navy">RUNTIME ADAPTERS</text>
    <text x="1477" y="355" text-anchor="middle" class="sans small muted">Codex: AGENTS.md + Stop</text>
    <text x="1477" y="379" text-anchor="middle" class="sans small muted">Claude: CLAUDE.md + Stop</text>
    <text x="1477" y="403" text-anchor="middle" class="sans small muted">Gemini: GEMINI.md + AfterAgent</text>
  </g>

  <path d="M330 465V500" class="control"/><path d="M710 465V500" class="control"/><path d="M1090 465V500" class="control"/><path d="M1470 465V500" class="control"/>

