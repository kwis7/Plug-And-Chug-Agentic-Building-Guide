    <text x="774" y="709" text-anchor="middle" class="sans label navy">SKILLS + TOOLS</text><text x="774" y="733" text-anchor="middle" class="sans" font-size="11" fill="#627583">search • data</text><text x="774" y="749" text-anchor="middle" class="sans" font-size="11" fill="#627583">claim ledgers</text>
