<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">把 Agent Harness 比作一家公司</title>
  <desc id="desc">用户是董事会，显眼的当前模型是可替换员工，Harness 外框包含全部配置、文件、工具、状态、门禁和适配器。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f3ff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7a35"/><stop offset="1" stop-color="#ffb23f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#26194d" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6750a4"/></marker>
    <style>
      .sans{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.title{font-size:31px;font-weight:800;fill:#1f1836}.subtitle{font-size:18px;font-weight:600;fill:#584d73}.cardTitle{font-size:22px;font-weight:800;fill:#211b35}.body{font-size:16px;font-weight:520;fill:#564d69}.small{font-size:14px;font-weight:600;fill:#5f5573}.white{fill:#fff}.centerTitle{font-size:35px;font-weight:900;fill:#fff}.centerBody{font-size:19px;font-weight:650;fill:#fff}.rail{font-size:15px;font-weight:800}.tag{font-size:13px;font-weight:800;letter-spacing:.7px}.line{stroke:#6750a4;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g filter="url(#shadow)"><rect x="520" y="25" width="560" height="105" rx="22" fill="#1f1836"/><text x="800" y="67" text-anchor="middle" class="sans white" font-size="24" font-weight="850">用户 = 董事会 / 公司所有者</text><text x="800" y="99" text-anchor="middle" class="sans white" font-size="17" font-weight="600">设定目标 • 拥有数据 • 批准高影响动作</text></g>
  <path d="M800 130V172" class="line"/>
  <rect x="55" y="165" width="1490" height="780" rx="34" fill="#fff" stroke="#6750a4" stroke-width="6"/>
  <rect x="80" y="185" width="915" height="66" rx="18" fill="#efe9ff"/><text x="105" y="215" class="sans title">HARNESS = 这个外框内所有配置架构的总和</text><text x="105" y="240" class="sans subtitle">Harness 不是笼统的“第二层”，而是围绕执行的整套公司运行系统。</text>
  <rect x="1115" y="188" width="395" height="56" rx="15" fill="#241b3d"/><text x="1312" y="211" text-anchor="middle" class="sans white tag">模型可以更换</text><text x="1312" y="233" text-anchor="middle" class="sans white" font-size="14" font-weight="650">Harness 和工作资产不会随之消失</text>

  <g filter="url(#shadow)"><rect x="90" y="280" width="365" height="155" rx="22" fill="#f7f4ff" stroke="#c8b8f5" stroke-width="2"/><circle cx="126" cy="318" r="18" fill="#7956c7"/><text x="126" y="325" text-anchor="middle" class="sans white" font-size="20" font-weight="900">1</text><text x="155" y="326" class="sans cardTitle">使命、Identity 与 Rules</text><text x="120" y="361" class="sans body"><tspan x="120">公司愿景、角色边界、规章制度、</tspan><tspan x="120" dy="25">权限和停止条件</tspan></text><rect x="119" y="403" width="205" height="22" rx="11" fill="#e6dcff"/><text x="221" y="419" text-anchor="middle" class="sans tag" fill="#51368f">建议规则 + 机械强制</text></g>
  <g filter="url(#shadow)"><rect x="1145" y="280" width="365" height="155" rx="22" fill="#f0f9ff" stroke="#9ed7f2" stroke-width="2"/><circle cx="1181" cy="318" r="18" fill="#1988b8"/><text x="1181" y="325" text-anchor="middle" class="sans white" font-size="20" font-weight="900">2</text><text x="1210" y="326" class="sans cardTitle">Skills、Tools 与 Connectors</text><text x="1175" y="361" class="sans body"><tspan x="1175">各部门功能包、设备、数据库、</tspan><tspan x="1175" dy="25">软件和外部服务访问</tspan></text><rect x="1174" y="403" width="198" height="22" rx="11" fill="#d8f1fc"/><text x="1273" y="419" text-anchor="middle" class="sans tag" fill="#09648b">能力 + 访问权限</text></g>
  <g filter="url(#shadow)"><rect x="90" y="475" width="365" height="155" rx="22" fill="#f0fbf6" stroke="#a6dfc5" stroke-width="2"/><circle cx="126" cy="513" r="18" fill="#278663"/><text x="126" y="520" text-anchor="middle" class="sans white" font-size="20" font-weight="900">3</text><text x="155" y="521" class="sans cardTitle">Memory 与 Knowledge</text><text x="120" y="556" class="sans body"><tspan x="120">Memory = 精简交接和恢复索引</tspan><tspan x="120" dy="25">Knowledge = 长期档案馆 / 知识库</tspan></text><rect x="119" y="598" width="214" height="22" rx="11" fill="#d9f4e7"/><text x="226" y="614" text-anchor="middle" class="sans tag" fill="#176449">有预算 • 按需读取</text></g>
  <g filter="url(#shadow)"><rect x="1145" y="475" width="365" height="155" rx="22" fill="#fff7ea" stroke="#f1ca82" stroke-width="2"/><circle cx="1181" cy="513" r="18" fill="#b46f11"/><text x="1181" y="520" text-anchor="middle" class="sans white" font-size="20" font-weight="900">4</text><text x="1210" y="521" class="sans cardTitle">Tasks、Status 与 Handoffs</text><text x="1175" y="556" class="sans body"><tspan x="1175">工单拥有状态和授权；Status 由</tspan><tspan x="1175" dy="25">任务确定性生成，不靠模型记忆</tspan></text><rect x="1174" y="598" width="215" height="22" rx="11" fill="#ffebc4"/><text x="1281" y="614" text-anchor="middle" class="sans tag" fill="#8a5206">确定性任务状态</text></g>
  <g filter="url(#shadow)"><rect x="90" y="670" width="365" height="155" rx="22" fill="#fff3f6" stroke="#efb5c7" stroke-width="2"/><circle cx="126" cy="708" r="18" fill="#bd416d"/><text x="126" y="715" text-anchor="middle" class="sans white" font-size="20" font-weight="900">5</text><text x="155" y="716" class="sans cardTitle">数据仓与实际执行桌面</text><text x="120" y="751" class="sans body"><tspan x="120">Raw originals • 当前 workspace</tspan><tspan x="120" dy="25">Artifacts • 轮转后的执行 logs</tspan></text><rect x="119" y="793" width="222" height="22" rx="11" fill="#f9dce5"/><text x="230" y="809" text-anchor="middle" class="sans tag" fill="#8f2f53">具名文件 • 禁止一口吞</text></g>
  <g filter="url(#shadow)"><rect x="1145" y="670" width="365" height="155" rx="22" fill="#f5f6f8" stroke="#c8ccd4" stroke-width="2"/><circle cx="1181" cy="708" r="18" fill="#5d6676"/><text x="1181" y="715" text-anchor="middle" class="sans white" font-size="20" font-weight="900">6</text><text x="1210" y="716" class="sans cardTitle">Outputs 与 Archive</text><text x="1175" y="751" class="sans body"><tspan x="1175">经过审核的交付柜和历史归档；</tspan><tspan x="1175" dy="25">对外发送仍需要当前授权</tspan></text><rect x="1174" y="793" width="225" height="22" rx="11" fill="#e5e7eb"/><text x="1286" y="809" text-anchor="middle" class="sans tag" fill="#444c5a">已审核 ≠ 自动可发送</text></g>
  <path d="M455 355H525" class="line"/><path d="M1145 355H1075" class="line"/><path d="M455 550H525" class="line"/><path d="M1145 550H1075" class="line"/><path d="M455 745H525" class="line"/><path d="M1145 745H1075" class="line"/>

  <g filter="url(#shadow)"><rect x="525" y="300" width="550" height="360" rx="34" fill="url(#model)" stroke="#a53b11" stroke-width="4"/><rect x="688" y="322" width="224" height="29" rx="14" fill="#7a2b0b" fill-opacity=".72"/><text x="800" y="342" text-anchor="middle" class="sans white tag">ACTIVE • 当前正在运行</text><text x="800" y="405" text-anchor="middle" class="sans centerTitle">MODEL = 员工</text><text x="800" y="441" text-anchor="middle" class="sans centerBody">读取 • 推理 • 使用工具 • 产出工作</text><text x="800" y="481" text-anchor="middle" class="sans white" font-size="17" font-weight="650">重点：它是活跃模块，但可以被替换</text><rect x="585" y="520" width="130" height="70" rx="18" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-opacity=".55"/><text x="650" y="549" text-anchor="middle" class="sans white rail">模型 A</text><text x="650" y="573" text-anchor="middle" class="sans white small">可选择</text><rect x="735" y="510" width="130" height="90" rx="20" fill="#fff" stroke="#7a2b0b" stroke-width="4"/><text x="800" y="546" text-anchor="middle" class="sans rail" fill="#8d310d">模型 B</text><text x="800" y="574" text-anchor="middle" class="sans tag" fill="#8d310d">ACTIVE</text><rect x="885" y="520" width="130" height="70" rx="18" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-opacity=".55"/><text x="950" y="549" text-anchor="middle" class="sans white rail">模型 C</text><text x="950" y="573" text-anchor="middle" class="sans white small">可选择</text><text x="800" y="635" text-anchor="middle" class="sans white" font-size="16" font-weight="720">换员工，不必重建整家公司</text></g>
  <g filter="url(#shadow)"><rect x="525" y="690" width="550" height="135" rx="24" fill="#2b2145"/><text x="800" y="728" text-anchor="middle" class="sans white" font-size="23" font-weight="850">质检与协作机制</text><text x="800" y="759" text-anchor="middle" class="sans white" font-size="16" font-weight="620">hooks • completion gates • validators • budgets</text><text x="800" y="785" text-anchor="middle" class="sans white" font-size="16" font-weight="620">resource locks • Git worktrees • runtime adapters</text><rect x="650" y="799" width="300" height="20" rx="10" fill="#b8a4f2"/><text x="800" y="814" text-anchor="middle" class="sans tag" fill="#251b3d">经过验证才叫机械强制</text></g>
  <g><rect x="250" y="852" width="1100" height="62" rx="18" fill="#efe9ff" stroke="#b9a5ed" stroke-width="2"/><text x="800" y="879" text-anchor="middle" class="sans" font-size="18" font-weight="850" fill="#3c2b68">仅在多 AGENT 中：中控协调模型 = 经理</text><text x="800" y="902" text-anchor="middle" class="sans" font-size="15" font-weight="650" fill="#584d73">经理模型负责路由和整合 → 有边界的 worker models 仍然是员工</text></g>
  <text x="800" y="976" text-anchor="middle" class="sans small">匿名化概念图 • 不含私人数据 • @kwis7</text>
</svg>
